{% extends 'base.html' %}

{% block title %}Password Reset Complete | TaskFlow{% endblock %}

{% block auth_content %}
<div class="auth-wrapper">
    <div class="auth-card" style="text-align: center;">
        <div style="display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: 20px; background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); font-size: 2rem; margin-bottom: 1.25rem;">
            ✅
        </div>
        <h1 style="font-size: 1.75rem; font-weight: 800; margin-bottom: 0.75rem;">Password Changed!</h1>
        <p style="color: var(--text-secondary); font-size: 0.92rem; line-height: 1.6; margin-bottom: 2rem;">
            Your password has been successfully reset. You can now sign in using your new credentials.
        </p>

        <a href="{% url 'login' %}" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-size: 1rem;">
            Sign In with New Password
        </a>
    </div>
</div>
{% endblock %}
